<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數學隨堂小測驗</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-lg p-8 rounded-3xl shadow-xl border border-blue-100">
        <h1 class="text-3xl font-bold text-blue-600 mb-6 text-center">📝 數學隨堂小測驗</h1>
        
        <!-- 學生姓名輸入 -->
        <div class="mb-8">
            <label class="block text-gray-700 font-bold mb-2">學生姓名：</label>
            <input type="text" id="studentName" placeholder="請輸入姓名" 
                   class="w-full px-4 py-3 rounded-xl border-2 border-blue-200 focus:border-blue-500 focus:outline-none transition">
        </div>

        <!-- 題目區域 -->
        <div id="quizForm" class="space-y-8">
            <!-- 題目 1 -->
            <div class="space-y-3">
                <p class="font-bold text-gray-800">1. 下列哪兩種數值會成正比關係？</p>
                <div class="space-y-2">
                    <label class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-blue-50 cursor-pointer transition"><input type="radio" name="q1" value="1" class="w-5 h-5"> <span>① 小明的身高和體重</span></label>
                    <label class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-blue-50 cursor-pointer transition"><input type="radio" name="q1" value="2" class="w-5 h-5"> <span>② 正方形的邊長和面積</span></label>
                    <label class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-blue-50 cursor-pointer transition"><input type="radio" name="q1" value="3" class="w-5 h-5"> <span>③ 父親的年齡和女兒的年齡</span></label>
                    <label class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-blue-50 cursor-pointer transition"><input type="radio" name="q1" value="4" class="w-5 h-5"> <span>④ 籃球的個數和總價</span></label>
                </div>
            </div>

            <!-- 題目 2 -->
            <div class="space-y-3">
                <p class="font-bold text-gray-800">2. 電器行清倉大拍賣，2 臺電風扇賣 1500 元，爸爸買了 6 臺，共要付多少元？</p>
                <div class="space-y-2">
                    <label class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-blue-50 cursor-pointer transition"><input type="radio" name="q2" value="1" class="w-5 h-5"> <span>① 500 元</span></label>
                    <label class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-blue-50 cursor-pointer transition"><input type="radio" name="q2" value="2" class="w-5 h-5"> <span>② 3000 元</span></label>
                    <label class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-blue-50 cursor-pointer transition"><input type="radio" name="q2" value="3" class="w-5 h-5"> <span>③ 4500 元</span></label>
                    <label class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-blue-50 cursor-pointer transition"><input type="radio" name="q2" value="4" class="w-5 h-5"> <span>④ 9000 元</span></label>
                </div>
            </div>

            <!-- 題目 3 -->
            <div class="space-y-3">
                <p class="font-bold text-gray-800">3. 下面哪一個是圓柱側面面積的公式？</p>
                <div class="space-y-2">
                    <label class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-blue-50 cursor-pointer transition"><input type="radio" name="q3" value="1" class="w-5 h-5"> <span>① 底面積 × 柱高</span></label>
                    <label class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-blue-50 cursor-pointer transition"><input type="radio" name="q3" value="2" class="w-5 h-5"> <span>② 底面圓周長 × 柱高</span></label>
                    <label class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-blue-50 cursor-pointer transition"><input type="radio" name="q3" value="3" class="w-5 h-5"> <span>③ 側面周長 × 高</span></label>
                    <label class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-blue-50 cursor-pointer transition"><input type="radio" name="q3" value="4" class="w-5 h-5"> <span>④ 長 × 寬 × 高</span></label>
                </div>
            </div>

            <!-- 題目 4 -->
            <div class="space-y-3">
                <p class="font-bold text-gray-800">4. 使用等量公理時，等號的左邊加上 1，等號的右邊要如何？</p>
                <div class="space-y-2">
                    <label class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-blue-50 cursor-pointer transition"><input type="radio" name="q4" value="1" class="w-5 h-5"> <span>① 加 1</span></label>
                    <label class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-blue-50 cursor-pointer transition"><input type="radio" name="q4" value="2" class="w-5 h-5"> <span>② 減 1</span></label>
                    <label class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-blue-50 cursor-pointer transition"><input type="radio" name="q4" value="3" class="w-5 h-5"> <span>③ 乘 1</span></label>
                    <label class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-blue-50 cursor-pointer transition"><input type="radio" name="q4" value="4" class="w-5 h-5"> <span>④ 除 1</span></label>
                </div>
            </div>
        </div>

        <button id="submitBtn" onclick="submitQuiz()" class="w-full mt-10 bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700 active:scale-95 transition shadow-lg">送出並看成績</button>
        <div id="result" class="hidden mt-6 p-4 rounded-xl font-bold text-center"></div>
    </div>

    <script>
        const answers = { q1: "4", q2: "3", q3: "2", q4: "1" };
        const questionsText = { 
            q1: "1. 下列哪兩種數值會成正比關係？ (正確答案：④)", 
            q2: "2. 電器行清倉大拍賣...共要付多少元？ (正確答案：③)", 
            q3: "3. 下面哪一個是圓柱側面面積的公式？ (正確答案：②)", 
            q4: "4. 使用等量公理時...右邊要如何？ (正確答案：①)" 
        };

        async function submitQuiz() {
            const name = document.getElementById('studentName').value;
            if (!name) { alert("請輸入姓名！"); return; }
            
            let score = 0;
            let wrongQs = [];
            for(let i=1; i<=4; i++) {
                let q = document.querySelector(`input[name="q${i}"]:checked`);
                if(!q) { alert("還有題目沒寫喔！"); return; }
                if(q.value === answers[`q${i}`]) score += 25;
                else wrongQs.push(`q${i}`);
            }

            const resultDiv = document.getElementById('result');
            resultDiv.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800');
            
            let html = `<p class="text-xl">${name} 同學，得分：${score} 分</p>`;
            if(wrongQs.length > 0) {
                resultDiv.classList.add('bg-red-100', 'text-red-800');
                html += `<p class="mt-4 text-left">需要加強的題目：</p><ul class="text-sm list-disc pl-5">`;
                wrongQs.forEach(q => html += `<li>${questionsText[q]}</li>`);
                html += `</ul>`;
            } else {
                resultDiv.classList.add('bg-green-100', 'text-green-800');
                html += `<p>太棒了！全部答對！</p>`;
            }
            
            resultDiv.innerHTML = html;
            document.getElementById('quizForm').classList.add('opacity-50', 'pointer-events-none');
            document.getElementById('submitBtn').style.display = 'none';

            try {
                await fetch('YOUR_GAS_WEB_APP_URL', {
                    method: 'POST',
                    mode: 'no-cors',
                    body: new URLSearchParams({'name': name, 'score': score})
                });
            } catch(e) {}
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隨堂小測驗</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-lg p-8 rounded-3xl shadow-xl border border-blue-100">
        <h1 class="text-3xl font-bold text-blue-600 mb-6 text-center">📝 隨堂小測驗</h1>
        
        <!-- 學生姓名輸入 -->
        <div class="mb-8">
            <label class="block text-gray-700 font-bold mb-2">請輸入學生姓名：</label>
            <input type="text" id="studentName" placeholder="例如：王小明" 
                   class="w-full px-4 py-3 rounded-xl border-2 border-blue-200 focus:border-blue-500 focus:outline-none transition">
        </div>

        <!-- 題目區域 -->
        <div class="space-y-8">
            <!-- 題目 1 -->
            <div class="space-y-3">
                <p class="font-bold text-lg text-gray-800">1. 台灣最高的山是哪一座？</p>
                <div class="space-y-2">
                    <label class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-blue-50 cursor-pointer transition">
                        <input type="radio" name="q1" value="阿里山" class="w-5 h-5 text-blue-600">
                        <span>阿里山</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-blue-50 cursor-pointer transition">
                        <input type="radio" name="q1" value="玉山" class="w-5 h-5 text-blue-600">
                        <span>玉山</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-blue-50 cursor-pointer transition">
                        <input type="radio" name="q1" value="陽明山" class="w-5 h-5 text-blue-600">
                        <span>陽明山</span>
                    </label>
                </div>
            </div>

            <!-- 題目 2 -->
            <div class="space-y-3">
                <p class="font-bold text-lg text-gray-800">2. 水的三態中，固態稱為什麼？</p>
                <div class="space-y-2">
                    <label class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-blue-50 cursor-pointer transition">
                        <input type="radio" name="q2" value="冰" class="w-5 h-5 text-blue-600">
                        <span>冰</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-blue-50 cursor-pointer transition">
                        <input type="radio" name="q2" value="水蒸氣" class="w-5 h-5 text-blue-600">
                        <span>水蒸氣</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-blue-50 cursor-pointer transition">
                        <input type="radio" name="q2" value="雲" class="w-5 h-5 text-blue-600">
                        <span>雲</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- 按鈕 -->
        <button id="submitBtn" onclick="submitQuiz()" 
                class="w-full mt-10 bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700 active:scale-95 transition shadow-lg">
            送出並看成績
        </button>

        <!-- 結果顯示區 -->
        <div id="result" class="hidden mt-6 p-4 bg-green-100 text-green-800 rounded-xl font-bold text-center"></div>
    </div>

    <script>
        async function submitQuiz() {
            const name = document.getElementById('studentName').value;
            const submitBtn = document.getElementById('submitBtn');
            
            if (!name) {
                alert("請先輸入姓名喔！");
                return;
            }

            const q1 = document.querySelector('input[name="q1"]:checked');
            const q2 = document.querySelector('input[name="q2"]:checked');

            if (!q1 || !q2) {
                alert("請完成所有題目！");
                return;
            }

            let score = 0;
            if (q1.value === "玉山") score += 50;
            if (q2.value === "冰") score += 50;

            // 準備上傳資料
            submitBtn.disabled = true;
            submitBtn.innerText = "上傳中...";

            try {
                // 將 YOUR_GAS_WEB_APP_URL 替換為你的 Google Apps Script 網址
                const response = await fetch('https://script.google.com/macros/s/AKfycbyz3bu3mlX0onSpiIGdNwISw3qdKsrktR2mFV2ayjDaVLuA7uYNRbWsTJL5ER_fBwMQ/exec', {
                    method: 'POST',
                    mode: 'no-cors', // 處理跨域限制
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        'name': name,
                        'score': score
                    })
                });

                const resultDiv = document.getElementById('result');
                resultDiv.classList.remove('hidden');
                resultDiv.innerText = `${name} 同學，你的得分是：${score} 分！(資料已傳送)`;
            } catch (error) {
                console.error('上傳錯誤:', error);
                alert("資料上傳失敗，請檢查網路連線或 GAS 設定。");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "送出並看成績";
            }
        }
    </script>
</body>
</html>

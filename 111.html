<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數學隨堂小測驗</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-lg p-8 rounded-3xl shadow-xl border border-blue-100">
        <h1 class="text-3xl font-bold text-blue-600 mb-6 text-center">📝 數學隨堂小測驗</h1>
        
        <!-- 學生資料輸入 -->
        <div class="grid grid-cols-2 gap-4 mb-8">
            <div>
                <label class="block text-gray-700 font-bold mb-2">班級：</label>
                <input type="text" id="class" class="w-full px-4 py-2 rounded-xl border-2 border-blue-200 focus:border-blue-500 focus:outline-none transition">
            </div>
            <div>
                <label class="block text-gray-700 font-bold mb-2">學號：</label>
                <input type="text" id="studentId" class="w-full px-4 py-2 rounded-xl border-2 border-blue-200 focus:border-blue-500 focus:outline-none transition">
            </div>
            <div class="col-span-2">
                <label class="block text-gray-700 font-bold mb-2">姓名：</label>
                <input type="text" id="studentName" class="w-full px-4 py-2 rounded-xl border-2 border-blue-200 focus:border-blue-500 focus:outline-none transition">
            </div>
        </div>

        <!-- 題目區域 -->
        <div class="space-y-8">
            <!-- 題目 1 -->
            <div class="space-y-3">
                <p class="font-bold text-gray-800">1. 下列哪兩種數值會成正比關係？</p>
                <div class="space-y-2">
                    <label class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-blue-50 cursor-pointer transition">
                        <input type="radio" name="q1" value="1" class="w-5 h-5 text-blue-600"> <span>① 小明的身高和體重</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-blue-50 cursor-pointer transition">
                        <input type="radio" name="q1" value="2" class="w-5 h-5 text-blue-600"> <span>② 正方形的邊長和面積</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-blue-50 cursor-pointer transition">
                        <input type="radio" name="q1" value="3" class="w-5 h-5 text-blue-600"> <span>③ 父親的年齡和女兒的年齡</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-blue-50 cursor-pointer transition">
                        <input type="radio" name="q1" value="4" class="w-5 h-5 text-blue-600"> <span>④ 籃球的個數和總價</span>
                    </label>
                </div>
            </div>

            <!-- 題目 2 -->
            <div class="space-y-3">
                <p class="font-bold text-gray-800">2. 電器行清倉大拍賣，2 臺電風扇賣 1500 元，爸爸買了 6 臺，共要付多少元？</p>
                <div class="space-y-2">
                    <label class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-blue-50 cursor-pointer transition">
                        <input type="radio" name="q2" value="1" class="w-5 h-5 text-blue-600"> <span>① 500 元</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-blue-50 cursor-pointer transition">
                        <input type="radio" name="q2" value="2" class="w-5 h-5 text-blue-600"> <span>② 3000 元</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-blue-50 cursor-pointer transition">
                        <input type="radio" name="q2" value="3" class="w-5 h-5 text-blue-600"> <span>③ 4500 元</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-blue-50 cursor-pointer transition">
                        <input type="radio" name="q2" value="4" class="w-5 h-5 text-blue-600"> <span>④ 9000 元</span>
                    </label>
                </div>
            </div>

            <!-- 題目 3 -->
            <div class="space-y-3">
                <p class="font-bold text-gray-800">3. 下面哪一個是圓柱側面面積的公式？</p>
                <div class="space-y-2">
                    <label class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-blue-50 cursor-pointer transition">
                        <input type="radio" name="q3" value="1" class="w-5 h-5 text-blue-600"> <span>① 底面積 × 柱高</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-blue-50 cursor-pointer transition">
                        <input type="radio" name="q3" value="2" class="w-5 h-5 text-blue-600"> <span>② 底面圓周長 × 柱高</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-blue-50 cursor-pointer transition">
                        <input type="radio" name="q3" value="3" class="w-5 h-5 text-blue-600"> <span>③ 側面周長 × 高</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-blue-50 cursor-pointer transition">
                        <input type="radio" name="q3" value="4" class="w-5 h-5 text-blue-600"> <span>④ 長 × 寬 × 高</span>
                    </label>
                </div>
            </div>

            <!-- 題目 4 -->
            <div class="space-y-3">
                <p class="font-bold text-gray-800">4. 使用等量公理時，等號的左邊加上 1，等號的右邊要如何？</p>
                <div class="space-y-2">
                    <label class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-blue-50 cursor-pointer transition">
                        <input type="radio" name="q4" value="1" class="w-5 h-5 text-blue-600"> <span>① 加 1</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-blue-50 cursor-pointer transition">
                        <input type="radio" name="q4" value="2" class="w-5 h-5 text-blue-600"> <span>② 減 1</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-blue-50 cursor-pointer transition">
                        <input type="radio" name="q4" value="3" class="w-5 h-5 text-blue-600"> <span>③ 乘 1</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-blue-50 cursor-pointer transition">
                        <input type="radio" name="q4" value="4" class="w-5 h-5 text-blue-600"> <span>④ 除 1</span>
                    </label>
                </div>
            </div>
        </div>

        <button id="submitBtn" onclick="submitQuiz()" 
                class="w-full mt-10 bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700 active:scale-95 transition shadow-lg">
            送出並看成績
        </button>

        <div id="result" class="hidden mt-6 p-4 bg-green-100 text-green-800 rounded-xl font-bold text-center"></div>
    </div>

    <script>
        async function submitQuiz() {
            const className = document.getElementById('class').value;
            const studentId = document.getElementById('studentId').value;
            const studentName = document.getElementById('studentName').value;
            const submitBtn = document.getElementById('submitBtn');
            
            if (!className || !studentId || !studentName) {
                alert("請填寫所有學生基本資料！");
                return;
            }

            const q1 = document.querySelector('input[name="q1"]:checked');
            const q2 = document.querySelector('input[name="q2"]:checked');
            const q3 = document.querySelector('input[name="q3"]:checked');
            const q4 = document.querySelector('input[name="q4"]:checked');

            if (!q1 || !q2 || !q3 || !q4) {
                alert("請完成所有題目！");
                return;
            }

            let score = 0;
            if (q1.value === "4") score += 25;
            if (q2.value === "3") score += 25;
            if (q3.value === "2") score += 25;
            if (q4.value === "1") score += 25;

            submitBtn.disabled = true;
            submitBtn.innerText = "上傳中...";

            try {
                // 請記得在此處放入你實際部署的 GAS 網址
                await fetch('https://script.google.com/macros/s/AKfycbyz3bu3mlX0onSpiIGdNwISw3qdKsrktR2mFV2ayjDaVLuA7uYNRbWsTJL5ER_fBwMQ/exec', {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        'name': `${className} ${studentId} ${studentName}`,
                        'score': score
                    })
                });

                const resultDiv = document.getElementById('result');
                resultDiv.classList.remove('hidden');
                resultDiv.innerText = `${studentName} 同學，你的得分是：${score} 分！(資料已送出)`;
            } catch (error) {
                alert("上傳失敗，請檢查網路連線。");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "送出並看成績";
            }
        }
    </script>
</body>
</html>
